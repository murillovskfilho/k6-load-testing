name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: compose up + k6 smoke (thresholds gate the job)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A smaller seed keeps CI fast. Smoke checks correctness and a latency ceiling,
      # not capacity, so the table size does not change what it proves.
      SEED_PARCELS: 20000
    steps:
      - uses: actions/checkout@v4

      - name: Typecheck the API
        working-directory: api
        run: |
          npm ci
          npm run typecheck

      - name: Start Postgres (seeded) and the API
        run: docker compose up -d --build --wait

      - name: k6 smoke
        # k6 exits non-zero when any threshold fails (p95, error rate, checks),
        # which fails this step and the job.
        run: docker compose run --rm k6 run /scripts/smoke.js

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
