name: k6-load-testing

# CPU and memory limits keep runs comparable across machines and between
# the "before" and "after" benchmarks. They are not a sizing recommendation.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parcel
      POSTGRES_PASSWORD: parcel # local-only throwaway credentials
      POSTGRES_DB: parcels
      SEED_PARCELS: ${SEED_PARCELS:-200000}
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    cpus: 2
    mem_limit: 2g
    healthcheck:
      # -h 127.0.0.1 on purpose: during init (schema + seed) Postgres only listens on the
      # unix socket, so the service turns healthy only after the seed has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U parcel -d parcels"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 300s

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://parcel:parcel@db:5432/parcels
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_POOL_WAIT_MS: ${PG_POOL_WAIT_MS:-5000}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Load generator. Not started by `docker compose up`; used through `docker compose run`.
  k6:
    image: grafana/k6:1.0.0
    profiles: ["k6"]
    user: "0:0" # write summaries to the bind-mounted results folder on Linux CI runners
    environment:
      BASE_URL: http://api:3000
      PARCELS: ${SEED_PARCELS:-200000}
      VARIANT: ${VARIANT:-}
      RESULTS_DIR: /results
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    depends_on:
      api:
        condition: service_healthy
    cpus: 2
    mem_limit: 1g

volumes:
  pgdata:
